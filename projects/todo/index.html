<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-Do • Jesse</title>
  <link rel="stylesheet" href="../../assets/style.css?v=125" />
</head>

<body class="todo">
  <header class="site-header">
    <nav class="nav">
      <a href="../../index.html" class="brand">Jesse</a>
      <div class="nav-links">
        <a href="../cafe/index.html">Café</a>
        <a href="../blog/index.html">Blog</a>
        <a href="../todo/index.html" aria-current="page">To-Do</a>

      </div>
    </nav>
  </header>

  <main class="container">
    <section class="card pad-lg">
      <h1 class="page-title">
        <span class="title-check" aria-hidden="true">✓</span>
        My Tasks
      </h1>

      <form class="todo-new">
        <input class="input" aria-label="New task" placeholder="Add a task and press Enter" />
        <button class="btn primary" type="submit">Add</button>
      </form>

      <div class="todo-list"></div>
    </section>
  </main>
  <script>
    (function () {
      const form = document.querySelector('.todo-new');
      const input = document.querySelector('.todo-new .input');
      const list = document.querySelector('.todo-list');
      const storageKey = 'jesseTodoTasks';

      if (!form || !input || !list) return;
      function saveTasks() {
        const tasks = [];

        list.querySelectorAll('.todo-item').forEach(function (item) {
          const title = item.querySelector('.todo-title');
          const checkbox = item.querySelector('input[type="checkbox"]');

          tasks.push({
            text: title.textContent,
            completed: checkbox.checked
          });
        });

        localStorage.setItem(storageKey, JSON.stringify(tasks));
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        // build a row
        const item = document.createElement('div');
        item.className = 'todo-item';
        item.innerHTML = `
        
        <input type="checkbox" aria-label="Mark task complete" />
        <div class="todo-title"></div>
        <div class="todo-actions">
          <button class="btn edit" type="button">Edit</button>
          <button class="btn delete" type="button">Delete</button>
        </div>
      `;
        item.querySelector('.todo-title').textContent = text;
        list.prepend(item);          // add to top
        input.value = '';            // clear box
        input.focus();               // return cursor to input
        saveTasks();

        // wire up buttons
        item.querySelector('input[type="checkbox"]').onchange = saveTasks;

        item.querySelector('.delete').onclick = () => {
          item.remove();
          saveTasks();
        };
        item.querySelector('.edit').onclick = () => {
          const title = item.querySelector('.todo-title');
          const original = title.textContent;

          title.contentEditable = 'true';
          title.focus();
          title.onkeydown = (event) => {
            if (event.key === 'Enter') {
              event.preventDefault();
              title.blur();
            }
          };
          title.onblur = () => {
            title.contentEditable = 'false';
            title.textContent = title.textContent.trim() || original;
            saveTasks();
          };
        };
      });
      const savedTasks = JSON.parse(localStorage.getItem(storageKey)) || [];

      savedTasks.slice().reverse().forEach(function (task) {
        const taskText = typeof task === 'string' ? task : task.text;
        const isCompleted = typeof task === 'object' && task.completed;

        input.value = taskText;
        form.requestSubmit();

        const addedItem = list.firstElementChild;
        addedItem.querySelector('input[type="checkbox"]').checked = isCompleted;
      });

      saveTasks();
    })();
  </script>
</body>

</html>
