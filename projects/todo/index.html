<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-Do • Jesse</title>
  <link rel="stylesheet" href="../../assets/style.css?v=125" />
</head>

<body class="todo">
  <header class="site-header">
    <nav class="nav">
      <a href="../../index.html" class="brand">Jesse</a>
      <div class="nav-links">
        <a href="../cafe/index.html">Café</a>
        <a href="../blog/index.html">Blog</a>
        <a href="../todo/index.html" aria-current="page">To-Do</a>

      </div>
    </nav>
  </header>

  <main class="container">
    <section class="card pad-lg">
      <h1 class="page-title">To-Do</h1>

      <form class="todo-new">
        <input class="input" placeholder="Add a task and press Enter" />
        <button class="btn primary" type="submit">Add</button>
      </form>

      <div class="todo-list">
        <div class="todo-item">
          <input type="checkbox" />
          <div class="todo-title">Match Blog header and spacing</div>
          <div class="todo-actions">
            <button class="btn">Edit</button>
            <button class="btn">Delete</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
    (function () {
      const form = document.querySelector('.todo-new');
      const input = document.querySelector('.todo-new .input');
      const list = document.querySelector('.todo-list');

      if (!form || !input || !list) return; // you moved stuff again, didn’t you?

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        // build a row
        const item = document.createElement('div');
        item.className = 'todo-item';
        item.innerHTML = `
        <input type="checkbox" />
        <div class="todo-title"></div>
        <div class="todo-actions">
          <button class="btn edit" type="button">Edit</button>
          <button class="btn delete" type="button">Delete</button>
        </div>
      `;
        item.querySelector('.todo-title').textContent = text;
        list.prepend(item);          // add to top
        input.value = '';            // clear box
        input.focus();               // keep you moving

        // wire up buttons
        item.querySelector('.delete').onclick = () => item.remove();
        item.querySelector('.edit').onclick = () => {
          const current = item.querySelector('.todo-title').textContent;
          const next = prompt('Edit task:', current);
          if (next !== null) item.querySelector('.todo-title').textContent = next.trim() || current;
        };
      });
    })();
  </script>
</body>

</html>
